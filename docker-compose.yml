services:
  # SERVICIO 01: Base de Datos PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: inv_database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432" # Expuesto a la PC para poder revisarlo con pgAdmin.
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Montar el script SQL para que Docker inicialice la tabla automáticamente
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - inv_network

  # SERVICIO 02: Backend Node.js
  backend:
    build: ./backend
    container_name: inv_backend
    environment:
      PORT: 3000
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: inventory_db
    depends_on:
      - database
    networks:
      - inv_network
    # El backend estara oculto al exterior por seguridad.

  # SERVICIO 03: Frontend (Web Nginx + Proxy Inverso)
  frontend:
    build: ./frontend
    container_name: inv_frontend
    ports:
      - "80:80" # Toda la app será accesible desde http://localhost
    depends_on:
      - backend
    networks:
      - inv_network

# Definimos la red aislada donde "hablaran" nuestros contenedores
networks:
  inv_network:
    driver: bridge

# Definimos un volumen persistente para que la Bd no pierda datos al apagarse.
volumes:
  pgdata:
