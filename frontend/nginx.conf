server {
    listen 80;

    # 1. Servir los archivos estáticos del frontend (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Si no encuentra el archivo, devuelve index.html (Útil para SPAs)
        try_files $uri $uri/ /index.html;
    }

    # 2. Configurar el Proxy Inverso para la API
    # Toda petición que comience con /api/ será redirigida al backend
    location /api/ {
        # 'backend' será el nombre del servicio que definiremos en docker-compose.yml
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
